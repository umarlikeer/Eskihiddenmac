name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'claude/**' ]
    paths: [ 'ElektrTarmoqGA/**', '.github/workflows/build-apk.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ElektrTarmoqGA
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElektrTarmoqGA-debug-apk
          path: ElektrTarmoqGA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
